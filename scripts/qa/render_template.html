<!doctype html>
<html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f4ede2;overflow:hidden}#root{display:inline-block}#root svg{display:block}</style></head>
<body><div id="root"></div>
<script type="module">
import { exportToSvg } from './excalidraw-render.bundle.js';
window.renderDiagram = async function(data) {
  try {
    const svg = await exportToSvg({elements:data.elements||[], appState:{...(data.appState||{}), exportBackground:true, exportWithDarkMode:false}, files:data.files||{}});
    document.getElementById('root').replaceChildren(svg);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  window.__renderComplete = true;
    return {success:true,width:svg.getAttribute('width'),height:svg.getAttribute('height')};
  } catch (e) { return {success:false,error:e?.stack||String(e)}; }
};
window.__moduleReady=true;
</script></body></html>
