<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>beautidraw harness</title>
    <link rel="stylesheet" href="./vendor/excalidraw.css" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #bd-state {
        position: fixed;
        z-index: 10000;
        top: 8px;
        left: 8px;
        max-width: min(620px, calc(100vw - 16px));
        padding: 8px 12px;
        border: 1px solid #64748b;
        border-radius: 4px;
        background: #ffffff;
        color: #0f172a;
        font: 14px/1.35 system-ui, sans-serif;
      }

      #bd-state[data-state="error"] {
        border-color: #b91c1c;
        color: #7f1d1d;
      }

      #bd-state button {
        margin-left: 8px;
        padding: 4px 8px;
      }

      #bd-frame-navigation {
        position: fixed;
        z-index: 9999;
        right: 8px;
        bottom: 8px;
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid #64748b;
        border-radius: 4px;
        background: #ffffff;
        font: 13px/1.2 system-ui, sans-serif;
      }

      #bd-frame-navigation:empty {
        display: none;
      }

      #bd-frame-navigation button {
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <div id="bd-state" role="status" aria-live="polite" data-state="loading">Loading editor…</div>
    <nav id="bd-frame-navigation" aria-label="Frame navigation"></nav>
    <main id="root" aria-label="Excalidraw editor"></main>
    <script type="module">
      // Fonts are fetched relative to this path. Everything is local — no CDN
      // at render time.
      window.EXCALIDRAW_ASSET_PATH = new URL("./vendor/", location.href).href;

      const stateRegion = document.getElementById("bd-state");
      const frameNavigation = document.getElementById("bd-frame-navigation");
      const editorRoot = document.getElementById("root");
      const NativeImage = window.Image;
      const imageObservations = [];
      const imageObservationWaiters = [];
      const sceneStates = new Map();
      let nextSceneId = 0;
      let observationContext = null;
      let latestLoadToken = 0;
      let loadQueue = Promise.resolve();
      window.__bdImageObservations = imageObservations;
      window.__bdMountedSceneId = null;
      window.__bdAttemptedSceneId = null;

      function beginScene() {
        const sceneId = ++nextSceneId;
        sceneStates.set(sceneId, { id: sceneId, urls: new Set() });
        return sceneId;
      }

      function registerSceneFiles(sceneId, files) {
        const state = sceneStates.get(sceneId);
        if (!state) return;
        for (const file of Object.values(files || {})) if (file?.dataURL) state.urls.add(file.dataURL);
      }

      function cleanupSceneObservations(sceneId) {
        for (const observation of imageObservations.filter((candidate) => candidate.sceneId === sceneId)) {
          observation.cleanup?.();
          imageObservations.splice(imageObservations.indexOf(observation), 1);
        }
        for (const waiter of imageObservationWaiters.filter((candidate) => candidate.sceneId === sceneId)) {
          waiter.reject(harnessError(
            "IMAGE_DEADLINE",
            "Scene image readiness was cancelled when its scene completed.",
            "Reload the scene and verify the embedded data URL.",
          ));
          imageObservationWaiters.splice(imageObservationWaiters.indexOf(waiter), 1);
        }
        sceneStates.delete(sceneId);
        if (sceneStates.size === 0) {
          for (const observation of imageObservations) observation.cleanup?.();
          imageObservations.length = 0;
          imageObservationWaiters.splice(0);
        }
      }

      function harnessError(code, reason, recovery) {
        const error = new Error(reason);
        error.code = code;
        error.harnessFailure = { reason, recovery };
        return error;
      }

      function setLoading() {
        stateRegion.replaceChildren(document.createTextNode("Loading editor…"));
        stateRegion.setAttribute("role", "status");
        stateRegion.setAttribute("aria-live", "polite");
        stateRegion.dataset.state = "loading";
      }

      function setReady(frameCount, sceneId, token) {
        if (token != null && token !== latestLoadToken) return;
        stateRegion.replaceChildren(document.createTextNode(`Ready — ${frameCount} frame${frameCount === 1 ? "" : "s"}`));
        stateRegion.setAttribute("role", "status");
        stateRegion.setAttribute("aria-live", "polite");
        stateRegion.dataset.state = "ready";
        window.__bdMountedSceneId = sceneId;
      }

      function setError(error, attemptedSceneId, token) {
        if (token != null && token !== latestLoadToken) return;
        const recovery = document.createElement("button");
        recovery.type = "button";
        recovery.id = "harness-recovery";
        recovery.dataset.testid = "harness-recovery";
        recovery.textContent = "Recover editor";
        stateRegion.replaceChildren(document.createTextNode(`${error.reason} ${error.recovery}`), recovery);
        stateRegion.setAttribute("role", "alert");
        stateRegion.removeAttribute("aria-live");
        stateRegion.dataset.state = "error";
        if (attemptedSceneId != null) window.__bdAttemptedSceneId = attemptedSceneId;
        recovery.addEventListener("click", () => location.reload());
      }

      function observeImage(image) {
        const record = {
          element: image,
          src: "",
          state: "pending",
          sceneId: observationContext,
        };
        const onLoad = () => {
          if (window.__bdTestImageSeam?.holdEvents || window.__bdTestImageSeam?.mode === "deadline") {
            record.deferredEvent = { state: "load" };
            return;
          }
          settle("load");
        };
        const onError = (event) => {
          if (window.__bdTestImageSeam?.holdEvents || window.__bdTestImageSeam?.mode === "deadline") {
            record.deferredEvent = { state: "error", error: event };
            return;
          }
          settle("error", event);
        };
        record.cleanup = () => {
          image.removeEventListener("load", onLoad);
          image.removeEventListener("error", onError);
          record.element = null;
        };
        const settle = (state, error) => {
          if (record.state !== "pending") return;
          record.src = image.currentSrc || image.src || "";
          record.state = state;
          if (error) record.error = String(error.message || error);
          if (record.sceneId == null) {
            const matches = [...sceneStates.values()].filter((scene) => scene.urls.has(record.src));
            if (matches.length === 1) record.sceneId = matches[0].id;
          }
          for (const waiter of [...imageObservationWaiters]) {
            if (waiter.expected !== record.src || waiter.sceneId !== record.sceneId) continue;
            imageObservationWaiters.splice(imageObservationWaiters.indexOf(waiter), 1);
            waiter.resolve(record);
          }
        };
        image.addEventListener("load", onLoad, { once: true });
        image.addEventListener("error", onError, { once: true });
        record.release = () => {
          if (!record.deferredEvent) return;
          const event = record.deferredEvent;
          record.deferredEvent = null;
          settle(event.state, event.error);
        };
        if (window.__bdTestImageSeam?.mode === "decode" && typeof image.decode === "function") {
          image.decode = () => Promise.reject(new Error("simulated decode failure"));
        }
        imageObservations.push(record);
        return record;
      }

      window.__bdReleaseImageEvents = () => {
        if (window.__bdTestImageSeam) window.__bdTestImageSeam.holdEvents = false;
        for (const observation of imageObservations) observation.release?.();
      };

      // Excalidraw's image cache uses the global constructor. Keep native
      // HTMLImageElement instances and record their eventual URL/state.
      window.Image = function ObservedImage(...args) {
        return observeImage(new NativeImage(...args)).element;
      };
      window.Image.prototype = NativeImage.prototype;

      const twoFrames = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      let animationFrameSequence = 0;
      const animationFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve(++animationFrameSequence)));

      function imageName(element) {
        return element.customData?.beautidrawImageName || element.id || element.fileId || "image";
      }

      function waitForObservation(expected, element, signal, sceneId) {
        return new Promise((resolve, reject) => {
          const existing = imageObservations.find((candidate) => candidate.sceneId === sceneId && candidate.src === expected);
          if (existing) {
            resolve(existing);
            return;
          }
          const waiter = {
            expected,
            sceneId,
            resolve: (record) => {
              signal.removeEventListener("abort", onAbort);
              resolve(record);
            },
            reject: (error) => {
              signal.removeEventListener("abort", onAbort);
              reject(error);
            },
          };
          const onAbort = () => {
            const index = imageObservationWaiters.indexOf(waiter);
            if (index >= 0) imageObservationWaiters.splice(index, 1);
            waiter.reject(harnessError(
              "IMAGE_DEADLINE",
              `Image ${imageName(element)} did not render before the 2000ms deadline.`,
              "Verify the embedded data URL and rebuild the deck.",
            ));
          };
          if (signal.aborted) return onAbort();
          signal.addEventListener("abort", onAbort, { once: true });
          imageObservationWaiters.push(waiter);
        });
      }

      async function waitForImage(file, element, signal, sceneId) {
        const expected = file?.dataURL;
        if (!expected) {
          throw harnessError(
            "IMAGE_FILE",
            `Image ${imageName(element)} is missing embedded file data.`,
            "Restore the embedded file data and rebuild the deck.",
          );
        }
        const abort = new Promise((_, reject) => {
          const onAbort = () => reject(harnessError(
            "IMAGE_DEADLINE",
            `Image ${imageName(element)} did not render before the 2000ms deadline.`,
            "Verify the embedded data URL and rebuild the deck.",
          ));
          if (signal.aborted) return onAbort();
          signal.addEventListener("abort", onAbort, { once: true });
        });
        const record = await Promise.race([waitForObservation(expected, element, signal, sceneId), abort]);
        if (record.state === "error") {
          throw harnessError(
            "IMAGE_ERROR",
            `Image ${imageName(element)} failed to load.`,
            "Verify the embedded data URL and rebuild the deck.",
          );
        }
        if (typeof record.element.decode === "function") {
          try {
            await Promise.race([record.element.decode(), abort]);
          } catch (error) {
            if (error.code === "IMAGE_DEADLINE") throw error;
            throw harnessError(
              "IMAGE_DECODE",
              `Image ${imageName(element)} decoded unsuccessfully.`,
              "Verify the embedded data URL and rebuild the deck.",
            );
          }
        }
        return record;
      }

      window.__bdWaitForImages = async (files = {}, imageElements = [], sceneId = observationContext) => {
        const controller = new AbortController();
        const deadline = setTimeout(() => controller.abort(), 2000);
        try {
          return await Promise.all(imageElements.map((element) => waitForImage(files[element.fileId], element, controller.signal, sceneId)));
        } finally {
          clearTimeout(deadline);
        }
      };

      function fixedChromeRects() {
        const selectors = [
          "#bd-state",
          "#bd-frame-navigation",
          "#root .App-menu_top",
          "#root .App-menu_bottom",
        ];
        return [...new Set(selectors.flatMap((selector) => [...document.querySelectorAll(selector)]))]
          .map((element) => {
            const rect = element.getBoundingClientRect();
            return { role: element.id || element.className, x: rect.x, y: rect.y, width: rect.width, height: rect.height };
          })
          .filter((rect) => rect.width > 0 && rect.height > 0);
      }

      function chromeModel(viewport = { width: innerWidth, height: innerHeight }) {
        const rects = fixedChromeRects();
        const top = Math.max(0, ...rects.filter((rect) => rect.y <= 24).map((rect) => rect.y + rect.height));
        const bottom = Math.max(0, ...rects.filter((rect) => rect.y + rect.height >= viewport.height - 24).map((rect) => viewport.height - rect.y));
        const left = Math.max(0, ...rects.filter((rect) => rect.x <= 0 && rect.y > 24 && rect.y + rect.height < viewport.height - 24).map((rect) => rect.x + rect.width));
        const right = Math.max(0, ...rects.filter((rect) => rect.x + rect.width >= viewport.width && rect.y > 24 && rect.y + rect.height < viewport.height - 24).map((rect) => viewport.width - rect.x));
        return {
          rects,
          offsets: { top, right, bottom, left },
          usableWidth: Math.max(1, viewport.width - left - right),
          usableHeight: Math.max(1, viewport.height - top - bottom),
        };
      }

      async function fitEditorToFrame(frame) {
        const model = chromeModel();
        window.__bdEditor.scrollToContent([frame], {
          fitToViewport: true,
          viewportZoomFactor: 1,
          animate: false,
          canvasOffsets: model.offsets,
        });
        await twoFrames();
        return window.__bdEditor.getAppState();
      }

      function editorCanvas() {
        const canvas = document.querySelector("#root canvas.excalidraw__canvas.static");
        if (!canvas) {
          throw harnessError(
            "IMAGE_CANVAS",
            "Mounted editor canvas was not available for image sampling.",
            "Verify that the Excalidraw editor mounted before reading image pixels.",
          );
        }
        return canvas;
      }

      function viewportBounds(element, appState) {
        const topLeft = window.__bdApi.sceneCoordsToViewportCoords({ sceneX: element.x, sceneY: element.y }, appState);
        const bottomRight = window.__bdApi.sceneCoordsToViewportCoords({ sceneX: element.x + element.width, sceneY: element.y + element.height }, appState);
        return {
          x: Math.min(topLeft.x, bottomRight.x),
          y: Math.min(topLeft.y, bottomRight.y),
          width: Math.abs(bottomRight.x - topLeft.x),
          height: Math.abs(bottomRight.y - topLeft.y),
        };
      }

      async function digestPixels(canvas, bounds) {
        const canvasRect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / Math.max(canvasRect.width, 1);
        const scaleY = canvas.height / Math.max(canvasRect.height, 1);
        const x = Math.max(0, Math.floor((bounds.x - canvasRect.x) * scaleX));
        const y = Math.max(0, Math.floor((bounds.y - canvasRect.y) * scaleY));
        const width = Math.max(1, Math.min(canvas.width - x, Math.ceil(bounds.width * scaleX)));
        const height = Math.max(1, Math.min(canvas.height - y, Math.ceil(bounds.height * scaleY)));
        const pixels = canvas.getContext("2d", { willReadFrequently: true }).getImageData(x, y, width, height).data;
        const digest = await crypto.subtle.digest("SHA-256", pixels);
        return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
      }

      async function sampleImageRegions(images, appState) {
        const canvas = editorCanvas();
        return Promise.all(images.map(async (image) => ({
          id: image.id,
          hash: await digestPixels(canvas, viewportBounds(image, appState)),
        })));
      }

      function clearSceneImageObservations(sceneId) {
        for (const observation of imageObservations.filter((candidate) => candidate.sceneId === sceneId)) {
          observation.cleanup?.();
          imageObservations.splice(imageObservations.indexOf(observation), 1);
        }
        for (const waiter of imageObservationWaiters.filter((candidate) => candidate.sceneId === sceneId)) {
          waiter.reject(harnessError(
            "IMAGE_DEADLINE",
            "Scene image readiness was cancelled while remounting the editor.",
            "Reload the scene and verify the embedded data URL.",
          ));
          imageObservationWaiters.splice(imageObservationWaiters.indexOf(waiter), 1);
        }
      }

      async function remountScene(elements, scene, sceneId, includeFiles) {
        clearSceneImageObservations(sceneId);
        window.__bdEditor = await window.__bdApi.remountEditor(editorRoot);
        window.__bdMountedSceneId = sceneId;
        observationContext = includeFiles ? sceneId : null;
        try {
          window.__bdEditor.updateScene({ elements, appState: scene.appState });
          if (includeFiles) {
            if (window.__bdTestFileFailure) throw harnessError(
              "FILE_LOAD",
              `File load failed: ${window.__bdTestFileFailure}`,
              "Verify the embedded files and rebuild the deck.",
            );
            try {
              window.__bdEditor.addFiles(Object.values(scene.files || {}));
            } catch (error) {
              throw harnessError(
                "FILE_LOAD",
                `File load failed: ${error.message || String(error)}`,
                "Verify the embedded files and rebuild the deck.",
              );
            }
          }
        } finally {
          observationContext = null;
        }
        watchMainMenu();
        updateFrameNavigation(elements);
        const frame = elements.find((element) => element.type === "frame");
        if (frame) await fitEditorToFrame(frame);
        return window.__bdEditor.getAppState();
      }

      function perturbMountedImagePixels(images, appState) {
        const canvas = editorCanvas();
        const context = canvas.getContext("2d");
        for (const image of images) {
          const bounds = viewportBounds(image, appState);
          const canvasRect = canvas.getBoundingClientRect();
          const x = Math.max(0, Math.min(canvas.width - 1, Math.floor((bounds.x - canvasRect.x + bounds.width / 2) * canvas.width / canvasRect.width)));
          const y = Math.max(0, Math.min(canvas.height - 1, Math.floor((bounds.y - canvasRect.y + bounds.height / 2) * canvas.height / canvasRect.height)));
          context.putImageData(new ImageData(new Uint8ClampedArray([1, 0, 1, 255]), 1, 1), x, y);
        }
      }

      async function imageRegionOracle(elements, files, sceneId) {
        const images = elements.filter((element) => element.type === "image");
        if (!images.length) return [];
        const frame = elements.find((element) => element.type === "frame");
        const loadedState = await fitEditorToFrame(frame);
        const actualFrame = await animationFrame();
        const loadedActual = await sampleImageRegions(images, loadedState);
        await animationFrame();
        const stableFrame = await animationFrame();
        if (window.__bdTestImageSeam?.mode === "stability") perturbMountedImagePixels(images, loadedState);
        const loadedStable = await sampleImageRegions(images, loadedState);

        const placeholderState = await remountScene(elements, { appState: loadedState }, sceneId, false);
        const placeholder = await sampleImageRegions(images, placeholderState);
        const actual = window.__bdTestImageSeam?.mode === "placeholder" ? placeholder : loadedActual;

        const restoredState = await remountScene(elements, { appState: loadedState, files }, sceneId, true);
        await window.__bdWaitForImages(files, images, sceneId);
        await twoFrames();
        const restoredActualFrame = await animationFrame();
        if (window.__bdTestImageSeam?.restoredHashMismatch) perturbMountedImagePixels(images, restoredState);
        const restored = await sampleImageRegions(images, restoredState);
        await animationFrame();
        const restoredStableFrame = await animationFrame();
        const restoredStable = await sampleImageRegions(images, restoredState);
        return images.map((image, index) => {
          const actualHash = actual[index].hash;
          const stableHash = loadedStable[index].hash;
          const placeholderHash = placeholder[index].hash;
          if (actualHash === placeholderHash) {
            throw harnessError(
              "IMAGE_PLACEHOLDER",
              `Image ${imageName(image)} rendered only its placeholder region.`,
              "Verify the editor image renderer and the embedded data URL.",
            );
          }
          if (actualHash !== stableHash) {
            throw harnessError(
              "IMAGE_STABILITY",
              `Image ${imageName(image)} did not remain stable across animation frames.`,
              "Wait for the editor image render to stabilize before reading the scene.",
            );
          }
          if (restored[index].hash !== actualHash) {
            throw harnessError(
              "IMAGE_RESTORE",
              `Image ${imageName(image)} restored mounted hash did not match the loaded scene hash.`,
              "Verify the final restored scene render before publishing the scene.",
            );
          }
          if (restored[index].hash !== restoredStable[index].hash) {
            throw harnessError(
              "IMAGE_STABILITY",
              `Image ${imageName(image)} did not remain stable across final restored animation frames.`,
              "Wait for the restored editor image render to stabilize before publishing the scene.",
            );
          }
          return {
            id: image.id,
            sceneId,
            actualHash,
            placeholderHash,
            actualFrame,
            stableFrame,
            distinctAnimationFrames: stableFrame > actualFrame,
            restoredHash: restored[index].hash,
            restoredActualFrame,
            restoredStableFrame,
            distinctRestoredAnimationFrames: restoredStableFrame > restoredActualFrame,
          };
        });
      }

      const elementBounds = (element) => ({ x: element.x, y: element.y, width: element.width || 0, height: element.height || 0 });
      const intersects = (a, b) => Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x) > 0 &&
        Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y) > 0;

      window.__bdReportFidelity = (elements, viewport) => {
        const frames = elements.filter((element) => element.type === "frame");
        const reports = [];
        const chrome = chromeModel(viewport);
        const elementById = new Map(elements.map((element) => [element.id, element]));
        const roleFontFamily = (role) => role === "mono" ? 3 : role === "handwritten" ? 5 : 6;
        const geometryTolerance = (metric) => Math.max(
          0.25,
          Math.min(0.75, Math.max(1, Math.abs(metric.width || 0), Math.abs(metric.height || 0)) * 0.001),
        );
        const convertedBounds = (element) => {
          if (element.type === "text" && element.containerId) {
            const container = elementById.get(element.containerId);
            if (!container?.label) return null;
            const converted = window.__bdApi.convertToExcalidrawElements([{
              id: container.id,
              type: container.type,
              x: container.x,
              y: container.y,
              width: container.width,
              height: container.height,
              strokeColor: container.strokeColor,
              backgroundColor: container.backgroundColor,
              label: { ...container.label, fontFamily: container.label.fontFamily ?? roleFontFamily(container.label.role ?? container.role ?? "prose") },
            }], { regenerateIds: false });
            return converted.find((candidate) => candidate.containerId === container.id && candidate.type === "text") ?? null;
          }
          if (element.type === "text") {
            const role = element.role === "mono" || element.role === "handwritten" ? element.role : "prose";
            const [measured] = window.__bdApi.convertToExcalidrawElements([{
              id: `${element.id}-fidelity-measure`,
              type: "text",
              x: element.x,
              y: element.y,
              text: element.text,
              fontSize: element.fontSize,
              fontFamily: element.fontFamily ?? roleFontFamily(role),
              role,
              textAlign: element.textAlign,
            }], { regenerateIds: false });
            return measured;
          }
          if (element.type === "rectangle" && element.label) {
            const converted = window.__bdApi.convertToExcalidrawElements([{
              id: element.id,
              type: element.type,
              x: element.x,
              y: element.y,
              width: element.width,
              height: element.height,
              strokeColor: element.strokeColor,
              backgroundColor: element.backgroundColor,
              label: { ...element.label, fontFamily: roleFontFamily(element.label.role ?? element.role ?? "prose") },
            }], { regenerateIds: false });
            return converted.find((candidate) => candidate.id === element.id) ?? null;
          }
          return null;
        };
        const chromeSceneBounds = (rect, appState) => {
          const topLeft = window.__bdApi.viewportCoordsToSceneCoords({ clientX: rect.x, clientY: rect.y }, appState);
          const bottomRight = window.__bdApi.viewportCoordsToSceneCoords({ clientX: rect.x + rect.width, clientY: rect.y + rect.height }, appState);
          return {
            x: Math.min(topLeft.x, bottomRight.x),
            y: Math.min(topLeft.y, bottomRight.y),
            width: Math.abs(bottomRight.x - topLeft.x),
            height: Math.abs(bottomRight.y - topLeft.y),
          };
        };
        const appState = window.__bdEditor.getAppState();
        const chromeBounds = chrome.rects.map((rect) => chromeSceneBounds(rect, appState));
        for (const frame of frames) {
          const fitZoom = Math.min(chrome.usableWidth / frame.width, chrome.usableHeight / frame.height);
          const members = elements.filter((element) => element.frameId === frame.id);
          const clipped = new Set();
          const overlap = new Set();
          const obscured = new Set();
          const geometry = new Set();
          const frameBounds = elementBounds(frame);
          for (const member of members) {
            if (member.customData?.beautidrawCompositionKind === "surface") continue;
            const memberBounds = elementBounds(member);
            if (memberBounds.x < frameBounds.x - 0.5 || memberBounds.y < frameBounds.y - 0.5 ||
              memberBounds.x + memberBounds.width > frameBounds.x + frameBounds.width + 0.5 ||
              memberBounds.y + memberBounds.height > frameBounds.y + frameBounds.height + 0.5) clipped.add(member.id);
            if (chromeBounds.some((bounds) => intersects(memberBounds, bounds))) obscured.add(member.id);
            const measured = convertedBounds(member);
            if (measured) {
              const tolerance = geometryTolerance(measured);
              const expected = member.customData?.beautidrawMeasuredBounds;
              const differs = (left, right) => ["x", "y", "width", "height"].some((field) => Math.abs(left[field] - right[field]) > tolerance);
              if (differs(member, measured) || (expected && (differs(member, expected) || differs(expected, measured)))) geometry.add(member.id);
            }
          }
          for (let i = 0; i < members.length; i += 1) {
            for (let j = i + 1; j < members.length; j += 1) {
              const a = members[i];
              const b = members[j];
              if (a.id === b.containerId || b.id === a.containerId) continue;
              if ([a.type, b.type].some((type) => type === "line" || type === "arrow")) continue;
              if (a.customData?.beautidrawCompositionKind === "surface" || b.customData?.beautidrawCompositionKind === "surface") continue;
              if (intersects(elementBounds(a), elementBounds(b))) {
                overlap.add(a.id);
                overlap.add(b.id);
              }
            }
          }
          const textSizes = members.filter((element) => element.type === "text").map((element) => element.fontSize * fitZoom);
          reports.push({
            frameId: frame.id,
            fitZoom,
            minimumEffectiveTextPx: textSizes.length ? Math.min(...textSizes) : 0,
            clippedElementIds: [...clipped].sort(),
            overlapElementIds: [...overlap].sort(),
            obscuredByChromeElementIds: [...obscured].sort(),
            geometryElementIds: [...geometry].sort(),
          });
        }
        return reports;
      };

      function updateFrameNavigation(elements) {
        frameNavigation.replaceChildren();
        for (const frame of elements.filter((element) => element.type === "frame")) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = frame.name || frame.id;
          button.addEventListener("click", () => window.__bdEditor.scrollToContent([frame]));
          frameNavigation.append(button);
        }
      }

      function labelMainMenu() {
        const menu = document.querySelector('[data-testid="main-menu-trigger"]');
        if (!menu) return false;
        menu.setAttribute("aria-label", "Open main menu");
        return true;
      }

      function watchMainMenu() {
        const root = document.getElementById("root");
        let observer;
        const deadline = setTimeout(() => observer.disconnect(), 2000);
        const onMutation = () => {
          if (!labelMainMenu()) return;
          observer.disconnect();
          clearTimeout(deadline);
        };
        observer = new MutationObserver(onMutation);
        observer.observe(root, { childList: true, subtree: true });
        onMutation();
      }

      window.__bdReady = (async () => {
        try {
          if (new URLSearchParams(location.search).has("failBoot")) throw new Error("simulated boot failure");
          const api = await import("./vendor/excalidraw.js");
          window.__bdApi = api;
          window.__bdEditor = await api.mountEditor(document.getElementById("root"));
          if (new URLSearchParams(location.search).has("delayMenu")) {
            const menu = document.querySelector('[data-testid="main-menu-trigger"]');
            const parent = menu?.parentNode;
            menu?.remove();
            if (menu && parent) setTimeout(() => parent.append(menu), 50);
          }
          watchMainMenu();
          await document.fonts.ready;
          return { ok: true };
        } catch (error) {
          const failure = {
            reason: `Editor boot failed: ${error.message || String(error)}`,
            recovery: "Reload the harness and verify the local editor bundle.",
          };
          setError(failure);
          return { ok: false, error: failure.reason, recovery: failure.recovery };
        }
      })();

      async function performSceneLoad(scene, sceneId, token) {
        try {
          let elements;
          if (!Array.isArray(scene?.elements)) {
            throw harnessError(
              "SCENE_RESTORE",
              "Scene restore failed: elements must be an array",
              "Verify the serialized scene elements and rebuild the deck.",
            );
          }
          try {
            elements = window.__bdApi.restoreElements(scene.elements, null);
          } catch (error) {
            throw harnessError(
              "SCENE_RESTORE",
              `Scene restore failed: ${error.message || String(error)}`,
              "Verify the serialized scene elements and rebuild the deck.",
            );
          }
          const fontName = (family) => family === 3 ? "Cascadia" : family === 5 ? "Excalifont" : "Nunito";
          const fontRequirements = elements.flatMap((element) => {
            if (element.type === "text" && typeof element.text === "string") {
              return [{ family: fontName(element.fontFamily), size: element.fontSize, text: element.text }];
            }
            if (element.label?.text) {
              return [{ family: fontName(element.label.fontFamily ?? 6), size: element.label.fontSize, text: element.label.text }];
            }
            return [];
          });
          await Promise.all(fontRequirements.map(({ family, size, text }) => document.fonts.load(`${size}px "${family}"`, text)));
          await document.fonts.ready;
          const missingFont = fontRequirements.find(({ family, size, text }) => !document.fonts.check(`${size}px "${family}"`, text));
          if (missingFont) {
            throw harnessError(
              "FONT_GATE",
              `Font gate failed for ${missingFont.family}@${missingFont.size}.`,
              "Verify the local fonts and rebuild the deck.",
            );
          }
          await remountScene(elements, scene, sceneId, true);
          const imageElements = elements.filter((element) => element.type === "image");
          const imageReadiness = await window.__bdWaitForImages(scene.files || {}, imageElements, sceneId);
          await twoFrames();
          const imageRegions = await imageRegionOracle(elements, scene.files || {}, sceneId);
          const frames = window.__bdReportFidelity(elements, { width: innerWidth, height: innerHeight });
          const failedFrames = frames.filter((frame) => frame.clippedElementIds.length || frame.overlapElementIds.length || frame.obscuredByChromeElementIds.length || frame.geometryElementIds.length || frame.minimumEffectiveTextPx < 12);
          if (failedFrames.length) {
            const frame = failedFrames[0];
            throw harnessError(
              "FIDELITY",
              `Fidelity report failed for ${frame.frameId}: ${[...frame.clippedElementIds, ...frame.overlapElementIds, ...frame.obscuredByChromeElementIds, ...frame.geometryElementIds].join(", ") || "effective text is below 12px"}.`,
              "Adjust the scene geometry and rebuild the deck.",
            );
          }
          setReady(frames.length, sceneId, token);
          return {
            state: "ready",
            sceneId,
            mountedSceneId: window.__bdMountedSceneId,
            attemptedSceneId: sceneId,
            missingImages: [],
            imageReadiness: imageReadiness.map(({ src, state, sceneId: observedSceneId }) => ({ src, state, sceneId: observedSceneId })),
            imageRegions,
            frames,
          };
        } catch (error) {
          const failure = error.harnessFailure ?? {
            reason: `Scene load failed: ${error.message || String(error)}`,
            recovery: "Verify the scene data and rebuild the deck.",
          };
          setError(failure, sceneId, token);
          return {
            state: "error",
            sceneId,
            mountedSceneId: window.__bdMountedSceneId,
            attemptedSceneId: sceneId,
            error: failure,
          };
        } finally {
          cleanupSceneObservations(sceneId);
        }
      }

      window.__bdLoadScene = (scene) => {
        const sceneId = beginScene();
        const token = ++latestLoadToken;
        window.__bdAttemptedSceneId = sceneId;
        registerSceneFiles(sceneId, scene?.files);
        setLoading();
        const run = loadQueue.then(() => performSceneLoad(scene, sceneId, token));
        loadQueue = run.catch(() => undefined);
        return run;
      };
    </script>
  </body>
</html>
